<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>积金持仓与卖出穿透分析工具</title>
    <!-- 引入纯前端轻量级 OCR 库 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #F4F6F9;
            --card-bg: #FFFFFF;
            --primary: #C5A059;
            --primary-dark: #A47E3B;
            --text-main: #1D1E22;
            --text-sub: #8C8D93;
            --border-color: #E2E8F0;
            --danger: #E53E3E;
            --success: #38A169;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 40px; }

        .header { background: #1D1E22; color: #FFF; padding: 20px; text-align: center; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
        .header h1 { font-size: 18px; color: var(--primary); margin-bottom: 4px; }
        .header p { font-size: 12px; color: #A0A2A8; }

        .container { padding: 14px; max-width: 600px; margin: 0 auto; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid var(--primary); padding-left: 8px; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        .form-row { display: flex; gap: 6px; }
        input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; outline: none; background: #FAFAFA; }
        input:focus, select:focus { border-color: var(--primary); background: #FFF; }

        /* 上传组件 */
        .upload-area { border: 2px dashed var(--primary); background: rgba(197, 160, 89, 0.05); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .upload-area:active { background: rgba(197, 160, 89, 0.15); }
        .upload-area p { font-size: 13px; color: var(--primary-dark); font-weight: 500; }
        .upload-area span { font-size: 11px; color: var(--text-sub); display: block; margin-top: 4px; }

        /* 按钮 */
        .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #FFF; }
        .btn-secondary { background: #EDF2F7; color: var(--text-main); margin-top: 6px; font-size: 12px; }
        .btn-danger-sm { background: transparent; color: var(--danger); border: none; font-size: 12px; padding: 2px 6px; }

        /* 表格展示 */
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
        .data-table th, .data-table td { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .data-table th { color: var(--text-sub); font-weight: normal; background: #F8FAFC; }
        .data-table input { padding: 4px; font-size: 11px; }

        .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; }
        .filter-bar select { font-size: 12px; padding: 6px; }

        .summary-box { display: flex; justify-content: space-around; background: #FFFDF6; border: 1px solid #F0E3B8; padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: center; }
        .summary-box .num { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
        .summary-box .lbl { font-size: 11px; color: var(--text-sub); }

        #ocrProgress { font-size: 12px; color: var(--primary-dark); margin-top: 8px; display: none; text-align: center; font-weight: 500; }
    </style>
</head>
<body>

<div class="header">
    <h1>积金持仓与卖出穿透工具</h1>
    <p>截图智能识别 + 锚点算法，快速厘清持仓来源</p>
</div>

<div class="container">

    <!-- 1. 历史锚点（选填） -->
    <div class="card">
        <div class="card-title">① 5/21 前历史锚点 (选填)</div>
        <p style="font-size:11px; color:#666; margin-bottom:8px;">只需填 5/21 前最后一笔卖出所匹配的买入批次<b>剩余克重</b>：</p>
        <div class="form-row form-group">
            <input type="date" id="anchorDate" value="2026-05-20">
            <input type="number" id="anchorWeight" placeholder="剩余克重(g)">
            <input type="number" id="anchorPrice" placeholder="买入单价(元)">
        </div>
        <button class="btn btn-secondary" onclick="setAnchor()">设为历史基准起点</button>
        <div id="anchorStatus" style="font-size:11px; color:var(--success); margin-top:4px;"></div>
    </div>

    <!-- 2. OCR 截图上传 -->
    <div class="card">
        <div class="card-title">② 交易截图智能识别 (OCR)</div>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <p>📷 点击上传手机银行“交易记录”截图</p>
            <span>支持富民银行等交易明细截图（可一次选多张）</span>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleOCR(this.files)">
        </div>
        <div id="ocrProgress">⏳ 正在解析图片文字中，请稍等...</div>
    </div>

    <!-- 3. 订单列表与手动调整 -->
    <div class="card">
        <div class="card-title">
            <span>③ 交易订单明细</span>
            <button class="btn-danger-sm" onclick="clearOrders()">清空表格</button>
        </div>
        <div style="overflow-x:auto;">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:22%">类型</th>
                        <th style="width:30%">时间</th>
                        <th style="width:18%">克重</th>
                        <th style="width:20%">单价</th>
                        <th style="width:10%"></th>
                    </tr>
                </thead>
                <tbody id="orderTableBody"></tbody>
            </table>
        </div>
        <button class="btn btn-secondary" onclick="addEmptyRow()">+ 手动添加一条订单</button>
    </div>

    <!-- 4. 卖出策略时间轴 -->
    <div class="card">
        <div class="card-title">④ 卖出策略变更点</div>
        <div class="form-row form-group">
            <input type="datetime-local" id="stratTime">
            <select id="stratValue">
                <option value="低价先出">低价先出</option>
                <option value="先进先出">先进先出</option>
            </select>
        </div>
        <button class="btn btn-secondary" onclick="addStrategy()">+ 添加策略切换点</button>
        <div id="stratList" style="font-size:11px; margin-top:6px; color:#555;"></div>
    </div>

    <!-- 计算触发 -->
    <button class="btn btn-primary" style="margin-bottom:16px;" onclick="calculateHoldings()">生成持仓与追溯明细</button>

    <!-- 5. 结果面板 -->
    <div id="resultSection" style="display:none;">
        <div class="summary-box">
            <div>
                <div class="num" id="resTotalGrams">0.00g</div>
                <div class="lbl">当前持仓克重</div>
            </div>
            <div>
                <div class="num" id="resAvgCost">￥0.00</div>
                <div class="lbl">持仓成本均价</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">当前持仓来源穿透</div>
            
            <!-- 筛选与排序工具栏 -->
            <div class="filter-bar">
                <select id="sortField" onchange="renderHoldings()">
                    <option value="date_asc">时间排序：从旧到新</option>
                    <option value="date_desc">时间排序：从新到旧</option>
                    <option value="price_asc">价格排序：从低到高</option>
                    <option value="price_desc">价格排序：从高到低</option>
                </select>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>买入时间</th>
                        <th>买入单价</th>
                        <th>剩余/原始克重</th>
                    </tr>
                </thead>
                <tbody id="holdingsTableBody"></tbody>
            </table>
        </div>

        <div class="card">
            <div class="card-title">卖出扣减追溯明细</div>
            <div id="sellMatchLogs" style="font-size:12px;"></div>
        </div>
    </div>

</div>

<script>
    let orders = [];
    let strategies = [];
    let anchor = null;

    function setAnchor() {
        const date = document.getElementById('anchorDate').value;
        const weight = parseFloat(document.getElementById('anchorWeight').value);
        const price = parseFloat(document.getElementById('anchorPrice').value);
        if(!weight || !price) return alert('请输入历史锚点克重与价格');
        anchor = { date, weight, price };
        document.getElementById('anchorStatus').innerText = `已设置起点：${date} 剩余${weight}g (￥${price}/g)`;
    }

    // 优化后的极速安全 OCR 调取逻辑
    async function handleOCR(files) {
        if(!files.length) return;
        const progress = document.getElementById('ocrProgress');
        progress.style.display = 'block';

        try {
            // 使用极速 CDN 节点拉取语言包
            const worker = await Tesseract.createWorker('chi_sim', 1, {
                workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/worker.min.js',
                corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@4/tesseract-core.wasm.js',
                langPath: 'https://tessdata.projectnaptha.com/4.0.0', // 稳定语言包镜像
                logger: m => {
                    if(m.status === 'recognizing text') {
                        progress.innerText = `⏳ 正在识别图片中... (${Math.round(m.progress * 100)}%)`;
                    } else if(m.status === 'loading tesseract core' || m.status === 'downloading tessdata') {
                        progress.innerText = `⏳ 首次加载算法库，请稍等...`;
                    }
                }
            });

            for(let i = 0; i < files.length; i++) {
                progress.innerText = `⏳ 正在分析第 (${i+1}/${files.length}) 张图片...`;
                const ret = await worker.recognize(files[i]);
                parseOCRText(ret.data.text);
            }

            await worker.terminate();
            alert('识别完成！请核对并编辑下方解析出的表格数据。');
        } catch(e) {
            console.error(e);
            alert('网络加载较慢导致超时。已为您切回手动模式，您可以直接在下方表格添加或微调订单！');
        }

        progress.style.display = 'none';
        renderOrderTable();
    }

    // 正则提取算法（专针对鸿运金截图优化）
    function parseOCRText(text) {
        const lines = text.split('\n');
        let tempDate = '';

        lines.forEach(line => {
            // 提取日期 (如 2026.08.21 或 2026-08-21)
            const dateMatch = line.match(/\d{4}[\.\-]\d{2}[\.\-]\d{2}/);
            if(dateMatch) tempDate = dateMatch[0].replace(/\./g, '-');

            // 判断交易类型
            let type = '';
            if(line.includes('买入')) type = '买入';
            if(line.includes('卖出')) type = '卖出';

            // 提取单价 (如 交易价995.14元/克 或 995.14元)
            const priceMatch = line.match(/(\d+\.?\d*)\s*元/);
            // 提取克重 (如 共1克 或 1g)
            const weightMatch = line.match(/(?:共|\b)(\d+\.?\d*)\s*(?:克|g)/);

            if(type && priceMatch && weightMatch) {
                orders.push({
                    id: Date.now() + Math.random(),
                    type: type,
                    date: tempDate || new Date().toISOString().split('T')[0],
                    weight: parseFloat(weightMatch[1]),
                    price: parseFloat(priceMatch[1])
                });
            }
        });
    }

    function renderOrderTable() {
        orders.sort((a,b) => new Date(a.date) - new Date(b.date));
        const tbody = document.getElementById('orderTableBody');
        tbody.innerHTML = orders.map((o, index) => `
            <tr>
                <td>
                    <select onchange="updateOrder(${index}, 'type', this.value)">
                        <option value="买入" ${o.type==='买入'?'selected':''}>买入</option>
                        <option value="卖出" ${o.type==='卖出'?'selected':''}>卖出</option>
                    </select>
                </td>
                <td><input type="date" value="${o.date}" onchange="updateOrder(${index}, 'date', this.value)"></td>
                <td><input type="number" value="${o.weight}" style="width:50px" onchange="updateOrder(${index}, 'weight', this.value)"></td>
                <td><input type="number" value="${o.price}" style="width:60px" onchange="updateOrder(${index}, 'price', this.value)"></td>
                <td><button class="btn-danger-sm" onclick="deleteOrder(${index})">✕</button></td>
            </tr>
        `).join('');
    }

    function updateOrder(index, field, value) {
        orders[index][field] = (field==='weight'||field==='price') ? parseFloat(value) : value;
    }

    function deleteOrder(index) {
        orders.splice(index, 1);
        renderOrderTable();
    }

    function addEmptyRow() {
        orders.push({ id: Date.now(), type: '买入', date: new Date().toISOString().split('T')[0], weight: 1, price: 800 });
        renderOrderTable();
    }

    function clearOrders() {
        orders = [];
        renderOrderTable();
    }

    function addStrategy() {
        const time = document.getElementById('stratTime').value;
        const val = document.getElementById('stratValue').value;
        if(!time) return alert('请选择时间');
        strategies.push({ time, val });
        strategies.sort((a,b) => new Date(a.time) - new Date(b.time));
        document.getElementById('stratList').innerHTML = strategies.map(s => `📍 ${s.time.replace('T',' ')} 切换为 <b>${s.val}</b>`).join('<br>');
    }

    let calculatedHoldingsPool = [];

    function calculateHoldings() {
        let pool = [];

        if(anchor) {
            pool.push({
                date: anchor.date,
                price: anchor.price,
                initWeight: anchor.weight,
                remaining: anchor.weight
            });
        }

        let sellLogs = [];

        for(let o of orders) {
            if(o.type === '买入') {
                pool.push({
                    date: o.date,
                    price: o.price,
                    initWeight: o.weight,
                    remaining: o.weight
                });
            } else if(o.type === '卖出') {
                let activeStrat = '先进先出';
                for(let s of strategies) {
                    if(new Date(o.date) >= new Date(s.time)) activeStrat = s.val;
                }

                let needSell = o.weight;
                let available = pool.filter(p => p.remaining > 0);

                if(activeStrat === '低价先出') {
                    available.sort((a,b) => a.price - b.price || new Date(a.date) - new Date(b.date));
                } else {
                    available.sort((a,b) => new Date(a.date) - new Date(b.date));
                }

                let matches = [];
                for(let lot of available) {
                    if(needSell <= 0) break;
                    let take = Math.min(lot.remaining, needSell);
                    lot.remaining -= take;
                    needSell -= take;
                    matches.push({ buyDate: lot.date, buyPrice: lot.price, weight: take });
                }

                sellLogs.push({ date: o.date, weight: o.weight, price: o.price, strat: activeStrat, matches });
            }
        }

        calculatedHoldingsPool = pool.filter(p => p.remaining > 0);
        
        renderHoldings();
        renderSellLogs(sellLogs);
        document.getElementById('resultSection').style.display = 'block';
    }

    function renderHoldings() {
        const sortVal = document.getElementById('sortField').value;
        let list = [...calculatedHoldingsPool];

        if(sortVal === 'date_asc') list.sort((a,b) => new Date(a.date) - new Date(b.date));
        if(sortVal === 'date_desc') list.sort((a,b) => new Date(b.date) - new Date(a.date));
        if(sortVal === 'price_asc') list.sort((a,b) => a.price - b.price);
        if(sortVal === 'price_desc') list.sort((a,b) => b.price - a.price);

        const totalGrams = list.reduce((sum, i) => sum + i.remaining, 0);
        const totalCost = list.reduce((sum, i) => sum + (i.remaining * i.price), 0);
        const avgCost = totalGrams > 0 ? (totalCost / totalGrams).toFixed(2) : '0.00';

        document.getElementById('resTotalGrams').innerText = totalGrams.toFixed(2) + 'g';
        document.getElementById('resAvgCost').innerText = '￥' + avgCost;

        document.getElementById('holdingsTableBody').innerHTML = list.map(item => `
            <tr>
                <td>${item.date}</td>
                <td>￥${item.price}</td>
                <td><b>${item.remaining}g</b> / ${item.initWeight}g</td>
            </tr>
        `).join('') || '<tr><td colspan="3" style="text-align:center;color:#999;">当前已清仓</td></tr>';
    }

    function renderSellLogs(logs) {
        document.getElementById('sellMatchLogs').innerHTML = logs.map(l => `
            <div style="background:#F8FAFC; padding:8px; border-radius:6px; margin-bottom:8px; border:1px solid #E2E8F0;">
                <div style="font-weight:600;">${l.date} 卖出 ${l.weight}g (￥${l.price}/g) - <span style="color:var(--primary-dark);">${l.strat}</span></div>
                ${l.matches.map(m => `
                    <div style="color:#666; font-size:11px; margin-top:2px;">
                        ↳ 扣减 ${m.buyDate} (￥${m.buyPrice}/g) 批次：<b>${m.weight}g</b>
                    </div>
                `).join('')}
            </div>
        `).join('') || '无卖出记录';
    }
</script>

</body>
</html>
